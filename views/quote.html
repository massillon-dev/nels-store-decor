<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Demander un devis | Nel's Store & Decor</title>
<meta name="description" content="Demandez votre devis personnalisé pour un bouquet, un mariage, un anniversaire ou une décoration événementielle avec Nel's Store & Decor.">
<meta property="og:title" content="Demander un devis | Nel's Store & Decor">
<meta property="og:image" content="/images/logo/logo.png">
<link rel="icon" type="image/png" sizes="32x32" href="/images/logo/favicon-32.png">
<link rel="apple-touch-icon" href="/images/logo/favicon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header class="navbar" id="navbar">
  <div class="navbar-inner">
    <a href="/" class="navbar-brand">
      <img src="/images/logo/logo.png" alt="Nel's Store & Decor" class="zoomable">
    </a>
    <nav class="navbar-menu" id="navbarMenu">
      <a href="/" data-i18n="nav_home">Accueil</a>
      <a href="/a-propos" data-i18n="nav_about">À propos</a>
      <a href="/services" data-i18n="nav_services">Services</a>
      <a href="/boutique" data-i18n="nav_shop">Boutique</a>
      <a href="/galerie" data-i18n="nav_gallery">Galerie</a>
      <a href="/realisations" data-i18n="nav_realisations">Réalisations</a>
      <a href="/contact" data-i18n="nav_contact">Contact</a>
    </nav>
    <div class="navbar-actions">
      <div class="navbar-phones"><a data-phone-1-link href="tel:"><i class="fa-solid fa-phone"></i> <span data-phone-1-text></span></a></div>
      <button class="hamburger" id="hamburger" aria-label="Menu"><span></span><span></span><span></span></button>
    </div>
  </div>
</header>

<section class="page-hero">
  <div class="container">
    <span class="breadcrumb">Nel's Store &amp; Decor</span>
    <h1 data-i18n="quote_hero_title">Demandez votre devis</h1>
    <p data-i18n="quote_hero_subtitle">Parlez-nous de votre projet, nous vous répondrons avec une proposition personnalisée.</p>
  </div>
</section>

<section class="section">
  <div class="container" style="max-width:840px;">
    <div class="form-card" data-reveal>
      <div class="form-alert" id="quoteAlert"></div>
      <form id="quoteForm" novalidate>
        <div class="form-grid">
          <div class="form-group">
            <label><span data-i18n="lbl_fullname">Nom complet</span> <span class="req">*</span></label>
            <input type="text" name="full_name" required maxlength="120">
          </div>
          <div class="form-group">
            <label><span data-i18n="lbl_phone">Téléphone</span> <span class="req">*</span></label>
            <input type="tel" name="phone" required maxlength="30">
          </div>
        </div>
        <div class="form-grid">
          <div class="form-group">
            <label data-i18n="lbl_email">Email</label>
            <input type="email" name="email" maxlength="150">
          </div>
          <div class="form-group">
            <label><span data-i18n="lbl_service_type">Type de prestation</span> <span class="req">*</span></label>
            <select name="service_type" required>
              <option value="">Sélectionnez...</option>
              <option value="Bouquet personnalisé">Bouquet personnalisé</option>
              <option value="Mariage">Mariage</option>
              <option value="Anniversaire">Anniversaire</option>
              <option value="Décoration événementielle">Décoration événementielle</option>
              <option value="Décoration intérieure">Décoration intérieure</option>
              <option value="Composition florale">Composition florale</option>
              <option value="Autre">Autre</option>
            </select>
          </div>
        </div>
        <div class="form-grid">
          <div class="form-group">
            <label data-i18n="lbl_event_date">Date de l'événement</label>
            <input type="date" name="event_date">
          </div>
          <div class="form-group">
            <label data-i18n="lbl_location">Lieu</label>
            <input type="text" name="location" maxlength="150">
          </div>
        </div>
        <div class="form-grid">
          <div class="form-group">
            <label data-i18n="lbl_guest_count">Nombre de personnes</label>
            <input type="text" name="guest_count" maxlength="40" placeholder="Ex : 80 invités">
          </div>
          <div class="form-group">
            <label data-i18n="lbl_budget">Budget approximatif</label>
            <input type="text" name="budget" maxlength="60" placeholder="Ex : 20 000 - 40 000 HTG">
          </div>
        </div>
        <div class="form-group full">
          <label data-i18n="lbl_description">Description du projet</label>
          <textarea name="description" maxlength="3000" placeholder="Décrivez votre vision, vos couleurs préférées, le style recherché..."></textarea>
        </div>
        <div class="form-group full">
          <label data-i18n="lbl_inspiration">Photo d'inspiration (facultatif)</label>
          <label class="form-file" for="inspirationImage">
            <i class="fa-solid fa-cloud-arrow-up"></i>
            <span>Cliquez pour choisir une image (JPG, PNG, WEBP — 5 Mo max)</span>
            <input type="file" id="inspirationImage" name="inspiration_image" accept="image/jpeg,image/jpg,image/png,image/webp">
          </label>
          <div class="form-file-name" id="inspirationFileName">Aucun fichier sélectionné</div>
        </div>
        <button type="submit" class="btn btn-primary btn-block"><span data-i18n="btn_send_request">Envoyer ma demande</span> <i class="fa-solid fa-paper-plane"></i></button>
      </form>
    </div>
  </div>
</section>

<div id="whatsapp-placeholder"></div>

<script src="/js/partials.js"></script>
<script src="/js/i18n.js"></script>
<script src="/js/main.js"></script>
<script src="/js/shop.js"></script>
</body>
</html>
